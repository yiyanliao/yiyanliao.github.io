<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>· ·</title>
<style>
  :root{
    --paper:#ededed; --bar:#f7f7f7; --bar-line:#e2e2e2;
    --ink:#1d1d1f; --muted:#8a8d92;
    --mine:#95ec69; --mine-ink:#0a1508;
    --hers:#ffffff; --hers-ink:#1d1d1f;
    --accent:#07c160;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111214; --bar:#1b1d20; --bar-line:#000;
      --ink:#e8e9ec; --muted:#8a8d92;
      --mine:#3eb575; --mine-ink:#04140a;
      --hers:#26282c; --hers-ink:#e8e9ec;
      --accent:#3eb575;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei","Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overscroll-behavior:none}
  header{flex:0 0 auto;background:var(--bar);border-bottom:1px solid var(--bar-line);
    position:relative;text-align:center;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;font-size:16px;font-weight:600}
  #reset{position:absolute;right:10px;bottom:8px;border:none;background:transparent;color:var(--muted);
    font-size:22px;line-height:1;padding:4px 8px;cursor:pointer;border-radius:8px}
  #reset:active{background:var(--bar-line)}
  #log{flex:1 1 auto;overflow-y:auto;padding:14px 12px 6px;-webkit-overflow-scrolling:touch}
  .row{display:flex;align-items:flex-end;gap:8px;margin:10px 0}
  .row.me{flex-direction:row-reverse}
  .av{flex:0 0 auto;width:38px;height:38px;border-radius:6px;object-fit:cover;
    display:flex;align-items:center;justify-content:center;font-size:20px;background:#f0b9c8}
  .av.me{background:#2b2e37}
  .bubble{max-width:72%;padding:9px 12px;border-radius:8px;font-size:16px;line-height:1.45;
    white-space:pre-wrap;word-break:break-word;position:relative;animation:pop .18s ease}
  .me .bubble{background:var(--mine);color:var(--mine-ink);border-top-right-radius:2px}
  .them .bubble{background:var(--hers);color:var(--hers-ink);border-top-left-radius:2px;
    box-shadow:0 1px 1px rgba(0,0,0,.05)}
  @keyframes pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px;padding:12px 14px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  footer{flex:0 0 auto;background:var(--bar);border-top:1px solid var(--bar-line);
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;align-items:flex-end}
  #box{flex:1 1 auto;resize:none;max-height:120px;border:none;border-radius:8px;padding:10px 12px;
    font-size:16px;font-family:inherit;background:var(--hers);color:var(--ink);line-height:1.4}
  #box:focus{outline:none}
  #send{flex:0 0 auto;border:none;border-radius:8px;padding:0 16px;height:40px;font-size:15px;font-weight:600;
    background:var(--accent);color:#fff;cursor:pointer;opacity:.5;transition:opacity .15s}
  #send.on{opacity:1}
  /* passphrase gate */
  #gate{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;z-index:9}
  #gate p{color:var(--muted);margin:0;font-size:15px}
  #gate input{border:1px solid var(--bar-line);background:var(--hers);color:var(--ink);
    border-radius:10px;padding:12px 14px;font-size:16px;width:min(280px,80vw);text-align:center}
  #gate button{border:none;border-radius:10px;padding:11px 22px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;cursor:pointer}
  #gate .err{color:#e0533d;font-size:13px;min-height:16px}
  .hidden{display:none!important}
</style>
</head>
<body>
  <header><span id="title">一岩</span><button id="reset" title="开始新聊天" aria-label="开始新聊天">＋</button></header>
  <div id="log"></div>
  <footer>
    <textarea id="box" rows="1" placeholder="发消息…" autocomplete="off"></textarea>
    <button id="send">发送</button>
  </footer>

  <div id="gate" class="hidden">
    <p>输入我们的暗号 🤫</p>
    <input id="pp" type="password" autocomplete="off" placeholder="暗号">
    <div class="err" id="gerr"></div>
    <button id="go">进来</button>
  </div>

<script>
  // ⬇⬇⬇ 部署 Worker 后把这行换成你的 Worker 地址 ⬇⬇⬇
  const WORKER_URL = "https://baobao-chat.yiyanliao.workers.dev";

  const AV_BAOBAO = "🐷";                // 宝宝头像（她自己，右侧）
  const AV_YIYAN  = "/img/avatar.jpg";   // 一岩头像（AI，左侧，站点同源头像）

  const $ = (s) => document.querySelector(s);
  const log = $("#log"), box = $("#box"), send = $("#send");
  const KEY_HIST = "bb_hist_v1", KEY_PP = "bb_pp_v1";
  let history = load(KEY_HIST) || [];
  let pass = localStorage.getItem(KEY_PP) || "";

  function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch{ return null; } }
  function saveHist(){ try{ localStorage.setItem(KEY_HIST, JSON.stringify(history.slice(-60))); }catch{} }

  function avatar(mine){
    // mine = 宝宝她自己（右侧，🐷）；否则 = 一岩 AI（左侧，头像照片）
    if(mine){ const d=document.createElement("div"); d.className="av"; d.textContent=AV_BAOBAO; return d; }
    const i=document.createElement("img"); i.className="av"; i.src=AV_YIYAN; i.alt=""; return i;
  }
  function bubble(role, text){
    const row=document.createElement("div"); row.className="row "+(role==="user"?"me them-no":"them");
    if(role==="user") row.classList.add("me"); else row.classList.add("them");
    row.appendChild(avatar(role==="user"));
    const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
    row.appendChild(b); log.appendChild(row); scroll();
    return b;
  }
  function typing(){
    const row=document.createElement("div"); row.className="row them";
    row.appendChild(avatar(false));
    const b=document.createElement("div"); b.className="bubble";
    b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    row.appendChild(b); log.appendChild(row); scroll(); return row;
  }
  function scroll(){ log.scrollTop=log.scrollHeight; }
  const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));

  // render saved history
  for(const m of history) bubble(m.role, m.content);

  box.addEventListener("input", ()=>{
    box.style.height="auto"; box.style.height=Math.min(box.scrollHeight,120)+"px";
    send.classList.toggle("on", box.value.trim().length>0);
  });
  box.addEventListener("keydown", (e)=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend(); }
  });
  send.addEventListener("click", doSend);

  let busy=false;
  async function doSend(){
    const text=box.value.trim();
    if(!text || busy) return;
    busy=true;
    box.value=""; box.style.height="auto"; send.classList.remove("on");
    bubble("user", text);
    history.push({role:"user", content:text}); saveHist();

    const t=typing();
    try{
      const res=await fetch(WORKER_URL, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:history, passphrase:pass})
      });
      if(res.status===401){ t.remove(); gateError("暗号不对哦"); openGate(); busy=false; return; }
      if(!res.ok){ throw new Error("http "+res.status); }

      // 累积完整回复，再拆成多条气泡逐条冒出来（像微信连发）
      const reader=res.body.getReader(); const dec=new TextDecoder(); let full="";
      while(true){ const {done,value}=await reader.read(); if(done) break; full+=dec.decode(value,{stream:true}); }
      t.remove();

      const parts=full.split(/\n+/).map(s=>s.trim()).filter(Boolean);
      if(parts.length===0) parts.push("🥺");
      for(let i=0;i<parts.length;i++){
        if(i>0) await sleep(500 + Math.min(parts[i].length*30, 900));
        bubble("assistant", parts[i]);
      }
      history.push({role:"assistant", content:parts.join("\n")}); saveHist();
    }catch(err){
      t.remove(); bubble("assistant","（一岩信号不好…等下再发一次🥺）");
    }
    busy=false;
  }

  // ---- passphrase gate ----
  function openGate(){ $("#gate").classList.remove("hidden"); $("#pp").focus(); }
  function gateError(m){ $("#gerr").textContent=m||""; }
  $("#go").addEventListener("click", ()=>{
    const v=$("#pp").value.trim(); if(!v){ gateError("要输暗号呀"); return; }
    pass=v; localStorage.setItem(KEY_PP, v); gateError(""); $("#gate").classList.add("hidden"); box.focus();
  });
  $("#pp").addEventListener("keydown",(e)=>{ if(e.key==="Enter") $("#go").click(); });

  // 开始新聊天：清空当前对话（保留暗号）
  $("#reset").addEventListener("click", ()=>{
    if(!confirm("开始新的聊天？会清空当前对话哦")) return;
    history=[]; saveHist(); log.innerHTML=""; box.focus();
  });

  if(!pass) openGate();
</script>
</body>
</html>
